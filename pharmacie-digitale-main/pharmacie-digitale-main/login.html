<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Pharmacie Digitale</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/register.css">
</head>
<body>
  <div class="premium-bg"><div class="blob-accent"></div></div>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="brand-icon"><i data-lucide="pill"></i></span>
        Pharmacie Digitale
      </a>
      <nav>
        <ul>
          <li><a href="index.html#features">Fonctionnalites</a></li>
          <li><a href="index.html#pricing">Tarifs</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="register.html" class="btn btn-primary">S'inscrire</a>
      </div>
    </div>
  </header>

  <main class="register-page" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="max-width:480px;width:100%;padding:24px;" data-aos="fade-up">
      <div class="register-right" style="padding:40px;">
        <div style="text-align:center;margin-bottom:32px;">
          <div style="width:64px;height:64px;border-radius:16px;background:var(--gradient-primary);display:inline-flex;align-items:center;justify-content:center;color:white;margin-bottom:16px;box-shadow:var(--shadow-glow);">
            <i data-lucide="log-in" style="width:28px;height:28px;"></i>
          </div>
          <h1 style="font-size:28px;margin-bottom:8px;">Bon retour !</h1>
          <p style="color:var(--color-text-medium);font-size:15px;">Connectez-vous a votre espace</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <div class="input-with-icon">
              <span class="input-icon"><i data-lucide="mail"></i></span>
              <input type="email" id="email" class="form-input" placeholder="vous@exemple.com" autocomplete="email" required>
            </div>
            <div class="form-error" data-for="email"><i data-lucide="alert-circle" style="width:14px;height:14px;"></i> <span></span></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Mot de passe</label>
            <div class="password-wrapper input-with-icon">
              <span class="input-icon"><i data-lucide="lock"></i></span>
              <input type="password" id="password" class="form-input" placeholder="Votre mot de passe" autocomplete="current-password" required>
              <button type="button" class="password-toggle" data-target="password"><i data-lucide="eye"></i></button>
            </div>
            <div class="form-error" data-for="password"><i data-lucide="alert-circle" style="width:14px;height:14px;"></i> <span></span></div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:14px;">
            <label class="form-checkbox" style="margin:0;">
              <input type="checkbox" id="remember">
              <span>Se souvenir de moi</span>
            </label>
            <a href="#" style="color:var(--color-primary);font-weight:600;">Mot de passe oublie ?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-btn">
            <span class="btn-text"><i data-lucide="log-in"></i> Se connecter</span>
            <span class="btn-loading" style="display:none;"><span class="spinner"></span> Connexion...</span>
          </button>

          <div class="divider">ou continuer avec</div>

          <div class="oauth-buttons">
            <button type="button" class="btn-oauth">
              <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Google
            </button>
            <button type="button" class="btn-oauth">
              <svg viewBox="0 0 24 24"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M13 1h10v10H13z"/><path fill="#00A4EF" d="M1 13h10v10H1z"/><path fill="#FFB900" d="M13 13h10v10H13z"/></svg>
              Microsoft
            </button>
          </div>

          <div class="login-link">
            Pas encore de compte ? <a href="register.html">S'inscrire</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Login simulation
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const btn  = document.getElementById('login-btn');
      const btnText = btn.querySelector('.btn-text');
      const btnLoad = btn.querySelector('.btn-loading');

      document.querySelectorAll('.password-toggle').forEach(t => {
        t.addEventListener('click', () => {
          const target = document.getElementById(t.dataset.target);
          target.type = target.type === 'password' ? 'text' : 'password';
        });
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pwd   = document.getElementById('password').value;
        let ok = true;

        const showErr = (id, msg) => {
          document.getElementById(id).classList.add('is-invalid');
          const err = document.querySelector(`.form-error[data-for="${id}"]`);
          err.querySelector('span').textContent = msg;
          err.classList.add('show');
          ok = false;
        };
        const clearErr = (id) => {
          document.getElementById(id).classList.remove('is-invalid');
          document.querySelector(`.form-error[data-for="${id}"]`).classList.remove('show');
        };

        clearErr('email'); clearErr('password');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) showErr('email', 'Email invalide');
        if (pwd.length < 6) showErr('password', 'Mot de passe trop court');
        if (!ok) return;

        btn.disabled = true;
        btnText.style.display = 'none';
        btnLoad.style.display = 'inline-flex';

        setTimeout(() => {
          window.location.href = 'dashboard/index.html';
        }, 1200);
      });
    });
  </script>
</body>
</html>
